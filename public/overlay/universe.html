<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HECTRON Live Universe</title>
  <style>
    :root { color-scheme: dark; --cyan: #5ee7ff; --violet: #9b8cff; --ink: #050914; --muted: #8ea0bd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: var(--ink); color: #edf5ff; font: 14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; }
    #space { position: fixed; inset: 0; width: 100%; height: 100%; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 42%, transparent 0 35%, rgba(0,0,0,.62) 100%); }
    .hud { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 32px 42px; pointer-events: none; }
    .top, .bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .brand { letter-spacing: .22em; text-transform: uppercase; font-size: 12px; color: var(--cyan); }
    .title { margin-top: 8px; font-size: clamp(24px, 4vw, 54px); letter-spacing: -.04em; font-weight: 700; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f7b955; box-shadow: 0 0 14px #f7b955; }
    .dot.live { background: #65f4b0; box-shadow: 0 0 14px #65f4b0; }
    .panel { min-width: 230px; padding: 14px 16px; border: 1px solid rgba(142,160,189,.22); background: rgba(5,9,20,.58); backdrop-filter: blur(10px); }
    .panel-label { color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .panel-value { margin-top: 6px; font-size: 18px; color: #fff; }
    .bottom { align-items: flex-end; }
    .events { max-width: 440px; color: var(--muted); }
    .event { padding: 5px 0; border-bottom: 1px solid rgba(142,160,189,.12); }
    .event strong { color: var(--cyan); font-weight: 500; }
    .coords { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11px; text-align: right; }
    @media (max-width: 700px) { .hud { padding: 20px; } .panel { min-width: 170px; } .top, .bottom { flex-direction: column; } .bottom { align-items: flex-start; } .coords { text-align: left; } }
  </style>
</head>
<body>
  <canvas id="space" aria-label="Universo HECTRON en tiempo real"></canvas>
  <div class="vignette"></div>
  <main class="hud">
    <header class="top"><div><div class="brand">HECTRON / LIVE UNIVERSE</div><div class="title" id="planet">Núcleo Autónomo</div></div><div class="status"><span class="dot" id="status-dot"></span><span id="status">conectando</span></div></header>
    <div class="bottom"><div class="events" id="events"><div class="event"><strong>SYS</strong> esperando señal del universo...</div></div><div class="panel"><div class="panel-label">Actividad de la red</div><div class="panel-value" id="activity">0%</div><div class="panel-label" style="margin-top:12px">Entidades activas</div><div class="panel-value" id="entities">0</div></div><div class="coords" id="coords">ORBIT 00.000 / SECTOR LOCAL<br>TELEMETRÍA EN ESPERA</div></div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.querySelector('#space'); const ctx = canvas.getContext('2d');
    const state = { activity: 0, entities: 3, pulse: 0, events: [] }; let socket;
    const resize = () => { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }; addEventListener('resize', resize); resize();
    const addEvent = (text, kind='SYS') => { state.events.unshift({ text, kind }); state.events = state.events.slice(0, 5); document.querySelector('#events').innerHTML = state.events.map(e => `<div class="event"><strong>${e.kind}</strong> ${e.text}</div>`).join(''); };
    function draw(t) { const w=innerWidth,h=innerHeight,cx=w/2,cy=h*.48; ctx.clearRect(0,0,w,h); const grad=ctx.createRadialGradient(cx,cy,2,cx,cy,Math.min(w,h)*.42); grad.addColorStop(0,'rgba(94,231,255,.28)'); grad.addColorStop(1,'rgba(94,231,255,0)'); ctx.fillStyle=grad; ctx.fillRect(0,0,w,h); for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(cx,cy,130+i*58,55+i*24,(t*.0001)*(i%2?1:-1),0,Math.PI*2);ctx.strokeStyle=`rgba(${94+i*22},${231-i*20},255,${.28-i*.045})`;ctx.lineWidth=i===0?2:1;ctx.stroke();} for(let i=0;i<70;i++){const a=i*2.399+t*.00002*(i%3+1),r=30+(i*47)%Math.min(w,h)*.42;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.42;ctx.fillStyle=i%7===0?'#9b8cff':'rgba(220,240,255,.7)';ctx.fillRect(x,y,i%7===0?2:1,i%7===0?2:1);} const pulse=30+Math.sin(t*.002)*5+state.activity*.7; ctx.beginPath();ctx.arc(cx,cy,pulse,0,Math.PI*2);ctx.fillStyle='rgba(94,231,255,.22)';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,pulse*.58,0,Math.PI*2);ctx.fillStyle='#5ee7ff';ctx.shadowBlur=35;ctx.shadowColor='#5ee7ff';ctx.fill();ctx.shadowBlur=0;requestAnimationFrame(draw); } requestAnimationFrame(draw);
    function update(data) { state.activity = Math.round(data.activity ?? state.activity); state.entities = data.entities ?? state.entities; document.querySelector('#activity').textContent=state.activity+'%'; document.querySelector('#entities').textContent=state.entities; document.querySelector('#planet').textContent=data.planet || 'Núcleo Autónomo'; document.querySelector('#coords').innerHTML=`ORBIT ${(data.orbit ?? 0).toFixed?.(3) || '00.000'} / SECTOR LOCAL<br>ÚLTIMA SEÑAL ${new Date().toLocaleTimeString()}`; }
    function connect() { socket = window.io(); socket.on('connect',()=>{document.querySelector('#status').textContent='señal activa';document.querySelector('#status-dot').classList.add('live');addEvent('conexión establecida','NET');}); socket.on('universe-state',msg=>update(msg.state || msg)); socket.on('universe-event',msg=>addEvent(msg.text,msg.kind||'LIVE')); socket.on('disconnect',()=>{document.querySelector('#status').textContent='reconectando';document.querySelector('#status-dot').classList.remove('live');}); } connect();
  </script>
</body>
</html>
