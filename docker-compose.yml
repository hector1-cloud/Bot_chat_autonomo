version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: hectron-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: hectron
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:

    build: .

    container_name: hectron-api

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./:/app

    command: >
      bash -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      "

volumes:

  postgres_data:
